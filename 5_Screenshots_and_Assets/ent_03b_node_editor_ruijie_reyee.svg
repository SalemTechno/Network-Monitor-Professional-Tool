  <rect x="20" y="304" width="820" height="250" rx="8" fill="#091d28" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="34" y="328" fill="#fde047" font-size="12" font-weight="bold">4. ENCRYPTED REMOTE REBOOT &amp; SMART AUTO-DETECT (RUIJIE / REYEE + MULTI-VENDOR)</text>

  <rect x="34" y="340" width="15" height="15" fill="#ffffff"/><text x="37" y="352" fill="#047857" font-size="12" font-weight="bold">v</text>
  <text x="56" y="352" fill="#4ade80" font-size="12" font-weight="bold">Enable Right-Click &amp; Scheduled Remote Device Reboot (AES-256 Encrypted)</text>

  <text x="34" y="385" fill="#cbd5e1" font-size="11.5">Model / OS:</text>
  <rect x="122" y="368" width="538" height="28" fill="#041019" stroke="#fde047" stroke-width="1.5"/>
  <text x="132" y="386" fill="#fde047" font-size="11.5" font-weight="bold">Ruijie / Reyee Switch, AP &amp; Router (RG-EG / RG-ES / RG-NBS / RG-RAP / RG-EW)  (v)</text>
  <rect x="668" y="366" width="156" height="31" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.4"/>
  <text x="746" y="386" fill="#ffffff" font-size="11.5" font-weight="bold" text-anchor="middle">Auto-Detect Model</text>

  <!-- Dropdown Preview Box -->
  <rect x="122" y="400" width="538" height="86" rx="4" fill="#071521" stroke="#38bdf8" stroke-dasharray="3,2"/>
  <text x="134" y="418" fill="#34d399" font-size="10.8" font-weight="bold">• Ruijie / Reyee Router &amp; Gateway (RG-EG105G / RG-EG210G / RG-EG310GH-E — eWeb/SSH)</text>
  <text x="134" y="437" fill="#7dd3fc" font-size="10.8" font-weight="bold">• Ruijie / Reyee Smart &amp; PoE Switch (RG-ES200 / RG-NBS3100 / RG-S2910 — eWeb CGI/SSH)</text>
  <text x="134" y="456" fill="#fde047" font-size="10.8" font-weight="bold">• Access Point - Ruijie / Reyee Wi-Fi (RG-RAP2200 / RG-RAP2260 / RG-RAP6262 / RG-EW)</text>
  <text x="134" y="475" fill="#cbd5e1" font-size="10.5">• Plus: WE/ISP Routers (Huawei/ZTE/TP-Link/Nokia), Sophos XG/XGS, MikroTik, NanoStation, Win/Linux</text>

  <text x="34" y="516" fill="#cbd5e1" font-size="11.5">Admin User:</text>
  <rect x="122" y="499" width="170" height="26" fill="#041019" stroke="#475569"/>
  <text x="130" y="516" fill="#ffffff" font-size="11.5">admin</text>
  <text x="310" y="516" fill="#cbd5e1" font-size="11.5">Password:</text>
  <rect x="380" y="499" width="210" height="26" fill="#041019" stroke="#475569"/>
  <text x="388" y="517" fill="#ffffff" font-size="12">**************</text>
  <text x="610" y="516" fill="#cbd5e1" font-size="11.5">eWeb / SSH Port:</text>
  <rect x="720" y="499" width="104" height="26" fill="#041019" stroke="#34d399"/>
  <text x="772" y="516" fill="#34d399" font-size="11.5" font-weight="bold" text-anchor="middle">80 / 22</text>

  <text x="34" y="544" fill="#86efac" font-size="10.5" font-weight="bold">Native Ruijie eWeb LuCI JSON-RPC (/cgi-bin/luci/api/cmd devSta.set reboot) + Basic CGI + SSH CLI Reboot Fallback!</text>

  <!-- Save / Cancel -->
  <rect x="490" y="568" width="190" height="38" rx="7" fill="#0a8044" stroke="#34d399" stroke-width="1.5"/>
  <text x="585" y="592" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">Save Device Configuration</text>
  <rect x="692" y="568" width="148" height="38" rx="7" fill="#991b1b" stroke="#fca5a5"/>
