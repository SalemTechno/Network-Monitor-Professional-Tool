<svg xmlns="http://www.w3.org/2000/svg" width="860" height="630" viewBox="0 0 860 630" font-family="Segoe UI, Consolas, Arial, sans-serif">
  <defs>
    <pattern id="gridRj" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#0b261c" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="860" height="630" fill="#cbd5e1" rx="6"/>
  <rect x="0" y="0" width="860" height="28" fill="#dbeafe" rx="6"/>
  <circle cx="15" cy="14" r="7.5" fill="#064e3b" stroke="#00ff88" stroke-width="1.5"/>
  <text x="30" y="19" fill="#1e293b" font-size="12" font-weight="600">Add / Edit Monitored Device — Multi-Vendor &amp; Ruijie / Reyee (Switch, AP &amp; Router) Support</text>
  <rect x="816" y="4" width="36" height="20" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="830" y="18" fill="#334155" font-size="11.5" font-weight="bold">X</text>

  <rect x="5" y="28" width="850" height="597" fill="#040d0a"/>
  <rect x="5" y="28" width="850" height="597" fill="url(#gridRj)"/>
  <rect x="8" y="31" width="844" height="591" fill="none" stroke="#10b981" stroke-width="2" rx="4"/>

  <rect x="20" y="40" width="820" height="38" rx="8" fill="#0a261a" stroke="#10b981" stroke-width="1.4"/>
  <text x="34" y="64" fill="#34d399" font-size="13" font-weight="bold">CONFIGURE DEVICE, RUIJIE / REYEE SWITCH, AP, ROUTER, MIKROTIK &amp; REMOTE REBOOT</text>

  <!-- Section 1 -->
  <rect x="20" y="86" width="820" height="128" rx="8" fill="#071a15" stroke="#10b981" stroke-width="1.2"/>
  <text x="34" y="108" fill="#fde047" font-size="11.5" font-weight="bold">1. DEVICE IDENTITY, CATEGORY &amp; TECHNICAL NOTES</text>
  <text x="34" y="135" fill="#cbd5e1" font-size="11.5">Device Name:</text>
  <rect x="132" y="119" width="290" height="25" fill="#04100d" stroke="#475569"/>
  <text x="140" y="136" fill="#ffffff" font-size="11.5" font-weight="bold">Ruijie Reyee RG-EG210G-P Core Switch/GW</text>
  <text x="442" y="135" fill="#cbd5e1" font-size="11.5">Order #:</text>
  <rect x="502" y="119" width="60" height="25" fill="#04100d" stroke="#475569"/>
  <text x="524" y="136" fill="#34d399" font-size="11.5" font-weight="bold">2</text>
  <text x="580" y="135" fill="#cbd5e1" font-size="11.5">Category:</text>
  <rect x="646" y="119" width="178" height="25" fill="#04100d" stroke="#10b981"/>
  <text x="654" y="136" fill="#ffffff" font-size="11" font-weight="bold">Server / Switch / AP / Router</text>

  <text x="34" y="169" fill="#cbd5e1" font-size="11.5">IP Address:</text>
  <rect x="132" y="153" width="190" height="25" fill="#04100d" stroke="#475569"/>
  <text x="140" y="170" fill="#38bdf8" font-size="12" font-weight="bold">172.16.20.2</text>
  <text x="340" y="169" fill="#cbd5e1" font-size="11.5">Notes / Line:</text>
  <rect x="424" y="153" width="400" height="25" fill="#04100d" stroke="#475569"/>
  <text x="432" y="170" fill="#ffffff" font-size="11">Ruijie Reyee Cloud eWeb Switch + RG-RAP2260 Wi-Fi 6 APs</text>
  <text x="34" y="200" fill="#6ee7b7" font-size="10.5" font-weight="bold">Supports: Ruijie / Reyee (RG-EG Routers, RG-ES / RG-NBS / RG-S2910 Switches, RG-RAP / RG-EW APs), WE, Sophos, MikroTik, Ubiquiti</text>

  <!-- Section 2 -->
  <rect x="20" y="222" width="820" height="74" rx="8" fill="#071a15" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="34" y="244" fill="#38bdf8" font-size="11.5" font-weight="bold">2. PING TIMING, OUTAGE CONFIRMATION &amp; LATENCY THRESHOLDS</text>
  <text x="34" y="274" fill="#cbd5e1" font-size="11.5">Ping Every: <tspan fill="#34d399" font-weight="bold">5 Secs</tspan>   |   Confirm Down After: <tspan fill="#fca5a5" font-weight="bold">4 Mins</tspan>   |   High Ping Warn: <tspan fill="#fbbf24" font-weight="bold">180 ms</tspan>   |   Critical Ping: <tspan fill="#f87171" font-weight="bold">450 ms</tspan></text>

